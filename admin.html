<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard — TEAM SHIVAA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0F172A;
            color: #fff;
            padding: 40px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #06B6D4, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: #6a84b0; margin-bottom: 30px; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }
        .stat-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #06B6D4;
            font-weight: 800;
        }
        .stat-label { color: #8aa0d0; margin-top: 8px; font-size: 0.9rem; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(15, 23, 42, 0.75);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        th {
            background: rgba(139, 92, 246, 0.15);
            padding: 16px;
            text-align: left;
            color: #06B6D4;
            font-weight: 600;
            font-size: 0.9rem;
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
            color: #b0c6f0;
            font-size: 0.9rem;
        }
        tr:hover { background: rgba(139, 92, 246, 0.05); }
        .btn-refresh {
            background: linear-gradient(135deg, #06B6D4, #8B5CF6);
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .loading { color: #8aa0d0; text-align: center; padding: 40px; }
        .empty { color: #6a84b0; text-align: center; padding: 40px; }
        .error { color: #ff6b7a; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Admin Dashboard</h1>
        <p class="subtitle">TEAM SHIVAA — User Management</p>
        
        <button class="btn-refresh" onclick="loadUsers()">🔄 Refresh Data</button>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">0</div>
                <div class="stat-label">Total Users</div>
            </div>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>BGMI ID</th>
                    <th>Registered On</th>
                </tr>
            </thead>
            <tbody id="usersTable">
                <tr><td colspan="5" class="loading">⏳ Loading users...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'https://team-shivaa-backend.onrender.com/api';
        
        async function loadUsers() {
            const table = document.getElementById('usersTable');
            const totalEl = document.getElementById('totalUsers');
            
            table.innerHTML = '<tr><td colspan="5" class="loading">⏳ Loading users...</td></tr>';
            
            try {
                const response = await fetch(API_URL + '/admin/users');
                const data = await response.json();
                
                if (data.success) {
                    totalEl.textContent = data.totalUsers;
                    
                    if (data.users.length === 0) {
                        table.innerHTML = '<tr><td colspan="5" class="empty">📭 No users registered yet.</td></tr>';
                        return;
                    }
                    
                    table.innerHTML = data.users.map((user, index) => `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td>${user.bgmiId || '—'}</td>
                            <td>${new Date(user.createdAt).toLocaleString()}</td>
                        </tr>
                    `).join('');
                } else {
                    table.innerHTML = '<tr><td colspan="5" class="error">❌ Failed to load users.</td></tr>';
                }
            } catch (error) {
                console.error('Error:', error);
                table.innerHTML = '<tr><td colspan="5" class="error">❌ Server error. Please check backend.</td></tr>';
            }
        }
        
        loadUsers();
    </script>
</body>
</html>
